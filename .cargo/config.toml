# Cargo configuration for the mirror repo.
#
# Per /loop 2026-07-04 Arc 0 (cargo test hang diagnosis + resolution):
# `mirror::kintsugi_main_in` uses TWO process-wide mechanisms that must
# not race across parallel test threads:
#   1. libc::pipe + dup2 fd capture per bootstrap/src/lib.rs (the
#      thread-local CAPTURE_STDOUT / CAPTURE_STDERR scaffold is the
#      parallel-safe alternative but not yet wired at the test call
#      sites)
#   2. set_current_dir cwd swap for CWD-relative grammar loading
#      (boot/std/mirror/grammar.mirror and siblings)
#
# 15 integration tests use `kintsugi_main_in` (composition_spawn_recall,
# cross_shard_resolution, crystal_substrate, init, kintsugi_ci_target,
# kintsugi_ci_typed_verdict, kintsugi_loop, kintsugi_on_rust,
# kintsugi_settle_text, kintsugi_spec, oid_smoke, recall, spawn,
# spawn_storage, strict_byte_coverage).
#
# Running `cargo test` WITHOUT --test-threads=1 races these mechanisms
# → pipe-buffer-full deadlock or cwd corruption. bootstrap/src/lib.rs
# documented "integration tests therefore run with --test-threads=1" as
# convention but nothing enforced it. Alex 2026-07-04 observed cargo
# test hang > 1hr as a direct consequence.
#
# Option D (Reed 2026-07-04): enforce via [env] RUST_TEST_THREADS = "1".
# Standard cargo env-var propagation; no source migration required.
# Long-term thread-safety (Options A/B/C — source migration, nextest,
# fork-per-call) deferred to /loop Arc 0 Tick 4+ per Alex Phase E.
#
# Regression gate: bootstrap/tests/cargo_test_thread_enforcement.rs
# asserts this file exists AND contains the enforcement. If a future
# tick makes tests truly thread-safe and removes the process-wide
# mechanisms, that tick can remove BOTH this config AND the regression
# test in one commit (the substrate-correct GREEN).

[env]
RUST_TEST_THREADS = "1"
