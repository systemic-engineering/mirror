[package]
name = "fractal"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The compiler's Mandelbrot set — multi-dim inference projection substrate. Identity envelope + signing chain + witnessed provenance. Migrated from fragmentation."
keywords = ["mirror", "fractal", "identity", "provenance", "signing"]
categories = ["cryptography"]

[features]
default = ["ssh"]
ssh = []  # Placeholder; slimmed keys.rs (step 3) will pull ssh-key + x25519-dalek + chacha20poly1305 + hkdf per Mara §4
gpg = []  # Deferred per Mara §4 (feature-gated; not needed for M0)

[dependencies]
# Alex 2026-07-18 direct-transcript redirect: "Consider how you can
# use the prismqueer macros for fractal." Instead of hand-copying
# 526 LOC of ssh-key/ECIES/GPG integration, compose via prismqueer's
# proc-macro layer (#[derive(DerivePrism)] + #[oid(...)] gives
# content-addressed Addressable + Display + optic metadata).
#
# Per Reed memory `feedback_prismqueer_macros_mirror_composes` (HARD
# RULE, Alex 2026-07-18): proc-macro-generated .rs is substrate-
# authored FLOOR, not hand-written extension. Actual crypto ops
# (SSH signing / verify) discharge via @tool(ssh-keygen, ~bin(path))
# at runtime; fractal is the shape-declaration crate over prismqueer's
# algebra.
#
# NO ssh-key/x25519/chacha20poly1305/hkdf. Crypto lives at @tool
# altitude, not in fractal's Rust source.
prismqueer = { path = "../../../prism/prismqueer" }
