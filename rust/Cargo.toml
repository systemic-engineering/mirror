[package]
# Terminal FLOOR of the mirror compiler. Per Mara `81294b3` §2.2 M0 +
# Seam `9c34ec4` ratification: standalone Cargo project (Taut `e0572f7`
# OQ5 resolved-by-construction — rust/ owns its own Cargo.toml, NOT a
# workspace member, until post-dock workspace lift MAY land).
#
# Three files. Three altitudes. Every altitude has exactly one file:
#   src/main.rs   — supervisor boot + @-operator addressing (Mara §5)
#   src/phone.rs  — @io socket-handover altitude          (Mara §3)
#   src/matrix.rs — sub-Turing FLANG emit + LAPACK/BLAS   (Mara §4)
#
# M0 authors ONLY the minimum surface so `mirror --help` empirically
# fires. LAPACK / FLANG / @io/socket accept / reflective tools/list /
# @-operator dispatch land at M2-M8 per Mara §2.2 dependency graph.
# Michelangelo/marble at implementation altitude too — the marble is
# whittled only far enough for M0 to breathe.
name = "mirror"
version = "0.1.0"
edition = "2021"
description = "mirror compiler — terminal-geometry Rust FLOOR (M0 scaffold)"
license = "MIT OR Apache-2.0"

[[bin]]
name = "mirror"
path = "src/main.rs"

# M0 dependencies — the minimum for `mirror --help` empirical firing.
#
# NO clap. NO structopt. NO serde. Hand-rolled argv parse of --help /
# --version keeps the M0 surface honest — the reflective cli-block
# reader (Mara §5.2 item 4) lands at M2 and reads mirror.spec directly;
# introducing clap now would breed abstraction the substrate hasn't
# asked for (Loki `b53aeeb` §5 cut #2: fixed vocabulary, not generic).
#
# LAPACK / FLANG dependencies land at M4-M5 co-tick when matrix.rs
# empirically fires (Mara §2.2 M5). Peer socket / @io/socket deps land
# at M8 (Taut `7f4307f` §Q2: boot-altitude sufficiency for M4 stdio).
#
# Fractal migration step 1+2 landing per Mara `2760c2a` canonical
# spec: fractal is the crate-adjacent identity/subject/signing/witnessed
# substrate (Mandelbrot projection of multi-dim inference per Alex
# 2026-07-18). Subject/SubjectKind + Witnessed + signing chain lives
# there; mirror/rust consumes it as thin API-passthrough via subject.rs
# wrapper (step 10). Steps 3-12 follow in sequential ticks.
[dependencies]
fractal = { path = "fractal" }
# matrix — sub-Turing FLANG floor crate (LAPACK + K=0 registry via
# book). Migrated 2026-07-26 from rust/src/{matrix.rs, book.rs} per
# Alex 2026-07-25 four-crate decomposition. main.rs uses matrix::book
# for @<name> resolution at at_operator dispatch.
matrix = { path = "matrix" }
# spectral — math substrate crate (property/pillar surface + shard
# manifest + post-Migration 4b singularity + magic). Migrated 2026-07-28
# from rust/src/{liquid.rs,spectral.rs}. main.rs uses spectral::liquid
# for property discharge; compile.rs likewise.
spectral = { path = "spectral" }
# roomba — mend-computation crate (byte-substrate for bilateral-arm-
# redundant collapse). Migrated 2026-07-28 from rust/src/collapse.rs
# per Alex 2026-07-25 four-crate decomposition. main.rs uses
# roomba::mend::{apply, find_redundant_arms, load_bilateral_corpus,
# BilateralDecl, RedundantArm, CollapseReport} for the mend surface.
roomba = { path = "roomba" }
# prismqueer with `lapack` + `bundle` features enabled. The `lapack`
# feature carries the FLANG-floor integration (prismqueer/build.rs
# compiles native/spectral.f90 + native/prism.f90 via flang and links
# LAPACK + BLAS + flang-rt). matrix.rs::eigenvalues delegates to
# prismqueer::ffi::eigenvalues at the ONE ordained numerical @io
# boundary (Loki matrix.rs essay + Mara terminal-geometry spec).
#
# Alex 2026-07-20 direct-transcript: "This is literally the FLOOR,
# Reed. We don't forward promise the FLOOR." — path A per matrix.rs
# docblock line 40 ratified: extend prism/prismqueer/build.rs to
# compile Fortran wrappers + link LAPACK.
prismqueer = { path = "../../prism/prismqueer", features = ["lapack", "bundle"] }

# Dev-dependencies for property-based RED tests grounded in Mara
# 3cd9a42 (grounding spec) + 5d3040d (math foundation). These are
# test-only; the binary at src/main.rs stays zero-dep until M4-M5.
# Path-deps to sibling crates (workspace-adjacent) so RED tests can
# reference the actual prismqueer::liquid + fate::Fate + terni::
# PropertyVerdict shapes Taut 058b892 verified.
[dev-dependencies]
# prismqueer moved to [dependencies] above with lapack+bundle features
# per Alex 2026-07-20 FLANG-floor directive. terni stays dev-only
# (property-test framework consumed by matrix.rs::prop_tests).
terni      = { path = "../../prism/imperfect" }
# tempfile: unique-per-test scratch dirs for filesystem-dependent
# tests in `collapse.rs::prop_tests` (iter 7 — covers
# `load_bilateral_corpus` which walks `<root>/shards/**/*.mirror`).
# Cleanup on TempDir drop; no leaked state.
tempfile = "3"

[profile.release]
# Match bootstrap's release profile shape for byte-parity of the
# eventual dock-motion binary swap (Mara §2.2 dock condition).
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
