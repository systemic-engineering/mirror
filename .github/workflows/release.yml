# Tag-triggered release: build the mirror binary for the canonical v0.1
# target (x86_64-unknown-linux-gnu) plus the macOS variants, sign the
# archives, attach them to the GitHub Release, and update the floating
# v0.1 tag to point at the freshly-cut v0.1.x.
#
# Per kintsugi-ci-v0.1 §1.2 + §6 + §7.

name: release

on:
  push:
    tags: ['v0.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re-)publish, e.g. v0.1.0. Must already exist.'
        required: true
        type: string

permissions:
  contents: write   # release create + tag update

env:
  # Single source of truth for the tag we're publishing, whether triggered
  # by tag push (github.ref_name) or by workflow_dispatch (inputs.tag).
  TAG_NAME: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: mirror-x86_64-unknown-linux-gnu.tar.gz
          # macOS targets (v0.1.1+): the flake builds flang-rt from LLVM
          # source on darwin. Magic Nix Cache (wired by default via
          # systemic-engineering/ci/actions/nix-setup@main) caches it
          # between runs of the same workflow; the first build of a given
          # flake-input rev still pays the full cost (~30-60 min) but
          # subsequent runs (including this one's retries) reuse the cached
          # /nix/store path. If a job times out, set CACHIX_AUTH_TOKEN as a
          # repo secret (see docs/CACHE.md) and the cachix opt-in step
          # below will populate a persistent binary cache.
          - target: aarch64-apple-darwin
            runner: macos-14
            archive: mirror-aarch64-apple-darwin.tar.gz
          - target: x86_64-apple-darwin
            runner: macos-13
            archive: mirror-x86_64-apple-darwin.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG_NAME }}

      # Use the same nix devShell as CI/kintsugi so the full toolchain
      # (rustc, gfortran, flang, lapack, blas) resolves through one ABI
      # world. The resulting binaries reference nix-store paths via rpath
      # — v0.1 distribution is nix-friendly; v0.2 will pursue portable
      # static distribution.
      #
      # Cachix opt-in: if CACHIX_AUTH_TOKEN is set as a repo secret, the
      # composite enables push+pull against the `systemic-engineering`
      # cache so flang-rt builds (the macOS bottleneck) are shared across
      # runs and forks. Without the secret the step is a no-op and we
      # fall back to Magic Nix Cache (default).
      - uses: systemic-engineering/ci/actions/nix-setup@main
        with:
          enable-cachix: ${{ secrets.CACHIX_AUTH_TOKEN != '' }}
          cachix-name: systemic-engineering
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build release binary
        run: nix develop -c cargo build --release --target ${{ matrix.target }} --manifest-path bootstrap/Cargo.toml

      - name: Package archive
        working-directory: bootstrap
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/mirror dist/mirror
          tar -czf dist/${{ matrix.archive }} -C dist mirror
          (cd dist && (sha256sum ${{ matrix.archive }} > ${{ matrix.archive }}.sha256 || \
            shasum -a 256 ${{ matrix.archive }} > ${{ matrix.archive }}.sha256))

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            bootstrap/dist/${{ matrix.archive }}
            bootstrap/dist/${{ matrix.archive }}.sha256
          retention-days: 7

  release:
    name: publish release + update floating tag
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG_NAME }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Concatenate checksums
        working-directory: dist
        run: |
          find . -name '*.sha256' -exec cat {} \; > checksums.txt
          cat checksums.txt

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          generate_release_notes: true
          files: |
            dist/**/mirror-*.tar.gz
            dist/checksums.txt

      - name: Update floating v0.1 tag
        if: startsWith(env.TAG_NAME, 'v0.1.')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Use update-ref instead of `git tag -f`: the latter respects
          # tag.gpgsign / tag.forceSignAnnotated in any inherited gitconfig
          # and will prompt for a tag message in non-interactive CI.
          TAG_SHA=$(git rev-parse "$TAG_NAME^{commit}")
          git update-ref refs/tags/v0.1 "$TAG_SHA"
          git push --force origin refs/tags/v0.1
