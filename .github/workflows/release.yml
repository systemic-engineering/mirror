# Tag-triggered release: build the mirror binary for the canonical v0.1
# target (x86_64-unknown-linux-gnu) plus the macOS variants, sign the
# archives, attach them to the GitHub Release, and update the floating
# v0.1 tag to point at the freshly-cut v0.1.x.
#
# Per kintsugi-ci-v0.1 §1.2 + §6 + §7.

name: release

on:
  push:
    tags: ['v0.*']

permissions:
  contents: write   # release create + tag update

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: mirror-x86_64-unknown-linux-gnu.tar.gz
            os: linux
          - target: x86_64-apple-darwin
            runner: macos-13
            archive: mirror-x86_64-apple-darwin.tar.gz
            os: macos
          - target: aarch64-apple-darwin
            runner: macos-14
            archive: mirror-aarch64-apple-darwin.tar.gz
            os: macos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # prismqueer's `lapack` feature compiles native/prism.f90 + spectral.f90
      # via gfortran. Linux needs system BLAS/LAPACK; macOS links to the
      # built-in Accelerate framework but still needs gfortran for the .f90
      # compile pass.
      - name: Install FFI deps (linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libblas-dev liblapack-dev libblas3 liblapack3

      - name: Install FFI deps (macos)
        if: matrix.os == 'macos'
        run: brew install gcc

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        working-directory: bootstrap
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package archive
        working-directory: bootstrap
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/mirror dist/mirror
          tar -czf dist/${{ matrix.archive }} -C dist mirror
          (cd dist && sha256sum ${{ matrix.archive }} > ${{ matrix.archive }}.sha256 || \
            shasum -a 256 ${{ matrix.archive }} > ${{ matrix.archive }}.sha256)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            bootstrap/dist/${{ matrix.archive }}
            bootstrap/dist/${{ matrix.archive }}.sha256
          retention-days: 7

  release:
    name: publish release + update floating tag
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Concatenate checksums
        working-directory: dist
        run: |
          find . -name '*.sha256' -exec cat {} \; > checksums.txt
          cat checksums.txt

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/**/mirror-*.tar.gz
            dist/checksums.txt

      - name: Update floating v0.1 tag
        if: startsWith(github.ref_name, 'v0.1.')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Move v0.1 to point at the cut tag.
          git tag -f v0.1 ${{ github.sha }}
          git push origin v0.1 --force
