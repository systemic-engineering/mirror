# mirror's own kintsugi gate — the bootstrap self-host.
#
# Single call site: ./actions/kintsugi (the same composite downstream
# consumers use, just referenced by local path so action changes ship in
# the same PR as the workflow that exercises them). The composite takes
# two self-host-specific inputs: `mirror-binary` (skip the release
# download, use the binary we just built from source) and `nix-shell:
# true` (wrap the kintsugi invocation in `nix develop -c` so the binary
# finds its nix-store FFI deps at runtime).
#
# Per kintsugi-ci-v0.1 §6.1 + form/process partition recognition (#55):
# the composite IS the form; this workflow IS one call into it.

name: kintsugi

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: kintsugi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kintsugi:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # composite posts a verdict comment on PRs
    steps:
      - uses: actions/checkout@v4

      # Nix devShell provides gfortran + lapack + blas (one ABI world).
      - uses: systemic-engineering/ci/actions/nix-setup@main

      # @mirror/store cache — recognition #43 (mirror IS a content-
      # addressed build system) wires through CI. Substrate-pull complete.
      - uses: actions/cache@v4
        with:
          path: ~/.mirror
          key: mirror-store-${{ runner.os }}-${{ hashFiles('shards/**/*.mirror', 'boot/**/*.mirror', 'mirror.spec') }}
          restore-keys: |
            mirror-store-${{ runner.os }}-

      - name: Build mirror
        run: nix develop -c cargo build --release --manifest-path bootstrap/Cargo.toml

      - name: Run kintsugi self-host
        uses: ./actions/kintsugi
        with:
          target: boot/std
          shatter: '4'
          mirror-binary: ./bootstrap/target/release/mirror
          nix-shell: 'true'
