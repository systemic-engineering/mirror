# mirror's own kintsugi gate — builds the bootstrap binary from source
# and runs the kintsugi self-host against boot/std.
#
# Cache strategy (recognition #43 — mirror IS a content-addressed build
# system):
#   - Swatinem/rust-cache: standard cargo target + registry cache for the
#     bootstrap workspace.
#   - actions/cache @ ~/.mirror: the @mirror/store bare fragmentation repo
#     (per docs/specs/mirror-store.md §10.5). Keyed on the substrate's
#     shard + boot + spec content hashes — same OID, same blob, cache hit.
#
# The composite action at actions/kintsugi/ stays intact for external
# consumers post-v0.1.0 and is NOT used here; this gate exercises the
# self-host path directly.
#
# Per kintsugi-ci-v0.1 §6.1.

name: kintsugi

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: kintsugi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kintsugi:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # System BLAS/LAPACK for the prismqueer lapack FFI feature.
      # Mirror's bootstrap consumes prismqueer::ffi which needs these.
      # Install both -dev (link) and runtime (.so.3) packages explicitly.
      - name: Install system BLAS/LAPACK
        run: sudo apt-get update && sudo apt-get install -y libblas-dev liblapack-dev libblas3 liblapack3 gfortran

      # Nix devShell provides flang that bootstrap/build.rs needs.
      # Same nix-setup as ci.yml uses.
      - uses: systemic-engineering/ci/actions/nix-setup@main

      # @mirror/store IS a bare fragmentation repo at ~/.mirror.
      # Cache across runs — recognition #43 (mirror IS a content-addressed
      # build system) wires through CI. Substrate-pull complete.
      - uses: actions/cache@v4
        with:
          path: ~/.mirror
          key: mirror-store-${{ runner.os }}-${{ hashFiles('shards/**/*.mirror', 'boot/**/*.mirror', 'mirror.spec') }}
          restore-keys: |
            mirror-store-${{ runner.os }}-

      - name: Build mirror
        env:
          LAPACK_DIR: /usr/lib/x86_64-linux-gnu
          BLAS_DIR: /usr/lib/x86_64-linux-gnu
          CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
        run: |
          GFORT_DIR=$(dirname $(gfortran -print-file-name=libgfortran.so.5))
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS="-L native=/usr/lib/x86_64-linux-gnu -L native=$GFORT_DIR -C link-arg=-Wl,-rpath,/usr/lib/x86_64-linux-gnu -C link-arg=-Wl,-rpath,$GFORT_DIR"
          nix develop -c cargo build --release --manifest-path bootstrap/Cargo.toml

      - name: Run kintsugi self-host
        run: |
          # Track down where update-alternatives points libblas.so.3 / liblapack.so.3.
          BLAS_LIB=$(dpkg -L libblas3 2>/dev/null | grep 'libblas.so.3$' | head -1)
          LAPACK_LIB=$(dpkg -L liblapack3 2>/dev/null | grep 'liblapack.so.3$' | head -1)
          GFORT_DIR=$(dirname $(gfortran -print-file-name=libgfortran.so.5))
          export LD_LIBRARY_PATH="$(dirname $BLAS_LIB):$(dirname $LAPACK_LIB):$GFORT_DIR:/usr/lib/x86_64-linux-gnu"
          BIN=./bootstrap/target/x86_64-unknown-linux-gnu/release/mirror
          $BIN kintsugi --ci --shatter 4 boot/std \
            | tee /tmp/kintsugi-verdict.mirror
          $BIN kintsugi --ci --format=json --shatter 4 boot/std \
            > /tmp/kintsugi-verdict.json
          jq -e '.verdict != "failure"' /tmp/kintsugi-verdict.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kintsugi-verdict
          path: |
            /tmp/kintsugi-verdict.mirror
            /tmp/kintsugi-verdict.json
          if-no-files-found: warn
          retention-days: 14
