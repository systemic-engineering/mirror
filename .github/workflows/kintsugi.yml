# mirror's own kintsugi gate — dogfoods the composite action against
# the boot/ grammar tree. Pre-v0.1: uses the in-repo `./actions/kintsugi`
# path. Post-v0.1 (T11.8): switches to `systemic-engineering/mirror/actions/kintsugi@v0.1`.
#
# Per kintsugi-ci-v0.1 §6.1.

name: kintsugi

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: kintsugi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kintsugi:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # for the sticky verdict comment
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run kintsugi over boot/
        uses: ./actions/kintsugi
        with:
          target: boot/std
          shatter: '4'
          threshold: '0.8'
          fail-on: failure
