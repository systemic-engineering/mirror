name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: systemic-engineering/ci/actions/nix-setup@main

      # Rust compile cache — keyed on Cargo.lock + bootstrap manifest.
      # Streamline tick (2026-06-20 Taut): the local devShell already
      # warms ~/.cargo-target via direnv; CI was cold-compiling every
      # run (~38min worst case observed 2026-06-19). Swatinem/rust-cache
      # caches ~/.cargo/{registry,git} + bootstrap/target/ keyed by
      # Cargo.lock content, shared with kintsugi.yml + release.yml via
      # `shared-key: bootstrap` so cache hits cross workflows.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bootstrap
          shared-key: bootstrap
          # Don't save the cache from PR branches — only main pushes
          # repopulate the shared key. Avoids fork PRs poisoning the
          # cache and keeps cache turnover deterministic.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run quality gate
        run: nix develop -c just check

  notify-on-failure:
    if: failure()
    needs: [check]
    uses: systemic-engineering/ci/.github/workflows/notify-ntfy.yml@main
    with:
      repo: ${{ github.repository }}
      workflow: ${{ github.workflow }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets:
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
