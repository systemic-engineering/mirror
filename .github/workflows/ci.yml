name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system BLAS/LAPACK
        run: sudo apt-get update && sudo apt-get install -y libblas-dev liblapack-dev gfortran
      - uses: systemic-engineering/ci/actions/nix-setup@main
      - name: Run quality gate
        env:
          LAPACK_DIR: /usr/lib/x86_64-linux-gnu
          BLAS_DIR: /usr/lib/x86_64-linux-gnu
          RUSTFLAGS: "-L native=/usr/lib/x86_64-linux-gnu"
        run: |
          GFORT_DIR=$(dirname $(gfortran -print-file-name=libgfortran.so.5))
          nix develop -c bash -c "export LD_LIBRARY_PATH=$GFORT_DIR:/usr/lib/x86_64-linux-gnu:\$LD_LIBRARY_PATH && just check"

  notify-on-failure:
    if: failure()
    needs: [check]
    uses: systemic-engineering/ci/.github/workflows/notify-ntfy.yml@main
    with:
      repo: ${{ github.repository }}
      workflow: ${{ github.workflow }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets:
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
