[workspace]
members = ["."]

[package]
name = "skeleton-key"
version = "0.1.0"
edition = "2021"
description = "Spectral cryptographic break — proof of concept"

[lib]
crate-type = ["lib"]

[features]
default = []
git = ["dep:ssh-key"]
db = ["git"]
slow = []
spectral = []  # kept for backward compat; coincidence is now always required

[dependencies]
prism = { path = "../prism" }
fragmentation = { path = "../fragmentation" }
fragmentation-git = { path = "../fragmentation-git" }
coincidence = { path = "../coincidence" }
spectral-db = { path = "../spectral-db" }
mirror = { path = "../mirror" }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
age = { version = "0.11", features = ["ssh"] }
base64 = "0.22"
eetf = "0.11"
git2 = "0.19"
ssh-key = { version = "0.6", features = ["std", "ed25519", "crypto"], optional = true }

[dev-dependencies]
tempfile = "3"
