[workspace]
members = ["."]

[package]
name = "mirror"
version = "0.1.0"
edition = "2021"
license-file = "LICENSE.md"
description = "fold | prism | traversal | lens | iso — the thing you look into that looks back"

[lib]
crate-type = ["lib"]

[[bin]]
name = "mirror"
path = "src/main.rs"

[features]
default = []
git = ["dep:ssh-key"]
db = ["git"]
slow = []
spectral = []  # kept for backward compat; coincidence is now always required
shatter = ["dep:serde", "dep:bincode"]

[dependencies]
prism = { package = "prism-core", path = "../prism/core", features = ["bundle", "lambda"] }
fragmentation = { path = "../fragmentation" }
fragmentation-git = { path = "../fragmentation-git" }
coincidence = { path = "../coincidence" }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"
# SHATTER_VERSION 1 is bound to bincode 1.3 legacy format (little-endian, fixed-size integers).
bincode = { version = "1.3", optional = true }
sha2 = "0.10"
hex = "0.4"
age = { version = "0.11", features = ["ssh"] }
base64 = "0.22"
eetf = "0.11"
git2 = "0.19"
ssh-key = { version = "0.6", features = ["std", "ed25519", "crypto"], optional = true }
unicode-segmentation = "1"
rust-stemmers = "1"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "mirror"
harness = false
