# Real StageFreight schema: top-level `builds:` + `targets:` parallel lists.
# See /Users/reed/dev/projects/StageFreight/README.md + docs/Docker.md +
# docs/Release.md for schema reference.

builds:
  - id: spectral-engineer
    kind: docker
    platforms: [linux/amd64]
    # Nix flake produces the docker image via dockerTools.buildLayeredImage;
    # StageFreight's build stage here is a passthrough that references the
    # Nix-produced image. Alternative: use `dockerfile:` + `context:` for a
    # StageFreight-native docker build (see docs/Docker.md for full schema).
    # [ALEX-VERIFY] StageFreight PR-A may not support nix-produced image
    # passthrough natively; if not, choose:
    #   - Author a thin Dockerfile that FROMs the Nix image, OR
    #   - Skip StageFreight builds[] and pre-build via `nix run .#deploy`
    dockerfile: "Dockerfile"  # placeholder; see [ALEX-VERIFY] above
    context: "."

targets:
  # fly.io container registry as image sink. fly.io is Docker-compatible
  # at the registry protocol layer; StageFreight can push to it as
  # `kind: registry` with `provider: docker`.
  - id: fly-registry
    kind: registry
    build: spectral-engineer  # references builds[].id
    url: registry.fly.io
    provider: docker          # docker-compatible auth (username/token)
    path: spectral-engineer   # image path within registry
    tags: ["{version}", "latest"]
    credentials: FLY          # → FLY_TOKEN env (single-token auth)
    when: { branches: [main], events: [push] }

    # Retention discipline per StageFreight registry-target schema.
    retention:
      keep_last: 10
      protect: ["latest"]

# fly.io DEPLOY happens OUTSIDE StageFreight via flyctl (see flake.nix
# apps.deploy). StageFreight's role at v0.1 is: build image + push to
# registry.fly.io + retention discipline. Deploy composition is:
#
#   1. `stagefreight build` — builds docker image per builds[]
#   2. `stagefreight publish` — pushes to registry.fly.io per targets[]
#   3. `flyctl deploy --image registry.fly.io/spectral-engineer:v0.1.0`
#      — dispatches to fly.io target-instance per fly.toml
#
# Alternative simpler composition (option (c) above): skip StageFreight
# entirely for v0.1 and run `nix run .#deploy` which does nix build →
# docker load → flyctl deploy in one chain. Choose per [ALEX-Q-4].

