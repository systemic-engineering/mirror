[package]
name = "mirror"
version = "0.1.1"
edition = "2021"

[dependencies]
# SHA-256 — still used by `hash.rs` (the canonical_hash / CoincidenceHash
# substrate, distinct from Splinter's content hash). The cascade swaps
# Splinter's hash to BLAKE3 (via the `MerkleHash` trait + the `Blake3`
# default) but leaves `hash.rs` untouched — different altitude, different
# machinery. Per docs/specs/store-vs-db-and-the-cascade.md §2.2.
sha2 = "0.10"
# BLAKE3 — the default `MerkleHash` backend for `Splinter`. Powers
# `@mirror/store`'s open content-addressed storage gate per the
# landing-page spec §1.1 (`docs/specs/store-vs-db-and-the-cascade.md`).
blake3 = { version = "1", default-features = false }
# The spectral-triple substrate. `prism-core` provides the `Prism` trait
# (the algebra A) and `IdentityPrism` (the identity element), with the
# `bundle` feature surfacing the supertrait closure that realizes the
# spectral-triple structure. `terni` provides `Imperfect` (the verdict
# carrier for D's partially-defined action) and `Metric` (the residual
# bound). Per docs/specs/prism-core-as-spectral-triple.md.
#
# The `lapack` feature wires prism-core's Fortran FFI (the dsyev /
# dgesvd wrappers over LAPACK; gfortran + Accelerate framework on
# darwin) so the bootstrap can discharge sheaf_laplacian.mirror's
# `lambda_zero` obligation via real eigendecomposition. Per T8
# (the LRM for the flang/mirror numerical split per
# docs/specs/numerical-substrate-via-fortran.md §1.4) and the
# substrate declaration in shards/epistemologic/math/sheaf_laplacian.mirror.
prismqueer = { version = "0.1", features = ["bundle", "lapack"] }
terni = { version = "0.7", default-features = false }
# Used by `cmd_kintsugi_single`'s `--ci` JSON serialiser. Per T11.2 of
# `docs/specs/kintsugi-ci-v0.1.md`. The `--ci` flag emits a verdict
# envelope (`verdict`, `target`, `objective`, `iterations`, `dark_count`)
# whose shape is the substrate-altitude obligation the wire altitude
# (GitHub Actions composite step) parses.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# libc — the OS-layer substrate carrier for the T20 portal lift
# (`docs/insights/2026-06-08-portal-eigenvalue-stream-gen-prism.md`
# §"T20 — SCM_RIGHTS handoff at the CLI pipe boundary"). The
# substrate's `shift(oid, T)` typed-capability primitive (the
# 26th-instance recognition) lands at the OS layer as `SCM_RIGHTS`
# fd-passing over AF_UNIX; the substrate state never re-serialises
# across the process boundary. `libc` exposes `fstat` (the
# socket-detection discriminator), `sendmsg` / `recvmsg` (the
# ancillary-message dance), and the `CMSG_*` macros (the cmsg
# walker). Pulled directly rather than via the `nix` crate because
# `libc` is the minimum substrate addition for the LRM closure;
# `nix` would be a heavier consumer-pull for the same surface.
#
# Per substrate decisions: `[[architecture-fragmentation-is-the-
# rust-substrate]]` (the OS layer IS the Rust substrate at this
# altitude); `[[feedback-substrate-already-had-the-word]]` (libc
# was already in the transitive closure via `cpufeatures`; the
# direct declaration just names it).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# fragmentation — the Rust substrate mirror has DECLARED but never
# imported. Per `[[architecture-fragmentation-is-the-rust-substrate]]`
# (the OS layer IS the Rust substrate) + `docs/specs/store-vs-db-
# and-the-cascade.md` (Mara 2026-06-04 §2.2 names fragmentation as
# the canonical content-addressed carrier). The substrate already
# had the WORD AND the WIRING; mirror's bootstrap just never plugged
# in until this commit — the entire git surface has been 60 lines of
# `Command::new("git")` shell-out at `bootstrap/src/git.rs`.
#
# Per Taut's scout (`docs/scouts/2026-06-27-taut-fragmentation-git-
# store-for-mirror-init.md`, commit 5580a7e) + Mara's mirror-init
# spec (`docs/specs/mirror-init.md`, commits fe215bd→14dd043) + Seam's
# audit (`docs/audits/2026-06-27-seam-mirror-init-spec-review.md`,
# commit 8392ab5): this single-line edge unblocks fragmentation's
# 5 load-bearing primitives — `frgmnt_store::FrgmntStore` (top-level
# crate), plus the `vcs/git/` workspace member's `GitStore` /
# `NamespacedGitStore` / `write_node` / `walk_commits_following`
# (the latter four require a separate `fragmentation-git` edge
# landing in subsequent ticks; THIS edge proves the foundation).
#
# Companion fix in `fragmentation` repo at commit `414d6b2`: stale
# `prism-core = { path = "../prism/core" }` was the second declared-
# but-not-wired instance discovered today (the crate had been renamed
# to `prismqueer`); rename-alias resolves it.
#
# Binary-size impact (R2 per Seam's audit): measured before/after at
# the GREEN commit message; Alex picks Posture A/B/C with real data.
[dependencies.fragmentation]
path = "../../fragmentation"

# fragmentation-spectral — the rich constructor for
# `fragmentation::SpectralCoordinate<N>`. Provides `hash::coordinate::<N>`
# via N-independent-observer coincidence method (Bothe 1924). This is
# the substrate-honest content-address for peer_contribute's before/after
# measurement per Rung 8+9 unification (Mara `c753d5b`; Reed's earlier
# `EigenvalueProfile<16>` re-invented what this crate already carries).
#
# Per Alex Wolf 2026-07-13 in-transcript: "Can't we just inline it into
# fragmentation? Feels easier" + "pull over what we need to ship this.
# No need to pull over everything." Minted at fragmentation `22b52ad` as
# workspace member (matches vcs/git / vcs/jj / vcs/mcp pattern). Only 6
# source modules pulled; 28 stay at /Users/alexwolf/dev/projects/coincidence.
#
# Zero new transitive deps (sha2 + hex + fragmentation already in mirror's
# closure). Substrate-honest architectural cleanup that composes cleanly
# with mirror's Rung 8+9.2+ refactor (retire EigenvalueProfile).
[dependencies.fragmentation-spectral]
path = "../../fragmentation/spectral"

# fate — optical inference at cli-surface altitude for cmd_peer_beam.
# Five-model selector (Abyss / Introject / Cartographer / Explorer /
# Fate) bound to prism operations via boot/std/epistemologic/math/
# bundle.mirror. Uses `prism = { package = "prismqueer" }` — same
# prismqueer bootstrap already carries; no version conflict.
#
# Composes with Mara `f3af5b4` @optics/lens/features species (which
# reuses graph_observation from @mirror/spectral/observation as its
# 16-dim carrier, byte-compatible with fate::Features). Seam `d9b7c35`
# Adj 1: v0 Rust discharge uses Features::default() (all zeros —
# "no observation yet" state) until the shards/magic/nl.mirror
# adapter cascade lands the @nl-driven encoder.
#
# `mirror peer beam <home> --fate-select` invokes Fate::excited()
# .resolve(&features, 5) — real optical inference from real Rust
# runtime; emits selected Model + mapped prism-op in unified-diff-
# shape envelope.
[dependencies.fate]
path = "../../fate"

# fragmentation-git — the git-transport workspace member of
# fragmentation (`vcs/git/`, package name `fragmentation-git`).
# Companion edge to `fragmentation` above; the two together surface
# the five load-bearing primitives Taut's scout pinned for `mirror
# init` composition:
#
#   from `fragmentation` (top-level, edge landed at 6b36808):
#     - frgmnt_store::FrgmntStore
#     - project::project (file-tree projection)
#     - encoding::encode (raw-bytes → Fractal<String>)
#
#   from `fragmentation-git` (THIS edge):
#     - NamespacedGitStore::open(&path, "mirror")
#     - NamespacedGitStore::insert_persistent(key, fractal, size)
#     - NamespacedGitStore::set_ref("HEAD", root_oid)
#
# The `NamespacedGitStore` lives at `.git/mirror/` per Mara's
# mirror-init spec §5: a namespaced view of the host repo's `.git/`,
# pollution-free of the working tree, traveling with clones if the
# refs are pushed. This is the substrate's CLOSED storage gate
# (`@spectral/db` per `architecture-mirror-store-vs-spectral-db`)
# operating ON the OPEN content-addressed foundation
# (`@mirror/store` per `shards/mirror/store.mirror`).
#
# Substrate-decl drift flagged by Taut (scout 2026-06-27): the
# `NamespacedGitStore` Rust surface uses `insert_persistent`/
# `set_ref` vocabulary while `@mirror/store` shard surface uses
# `read`/`write`/`exists`/`diff`/`walk`/`verify`. The Rust impl is
# below the substrate-decl altitude (one concrete realization of
# the declared surface); the drift is structural-not-blocker for
# v0; future tick admits `insert_persistent`/`set_ref` to
# substrate vocabulary OR wraps the calls through a thin trait
# whose method names match the shard. Task entry follows separately.
#
# No default features needed; `NamespacedGitStore` is unflagged.
# Transitive: pulls `git2 = "0.19"` (R2 posture — binary-size
# delta to be measured at P4 GREEN composition commit, where the
# code is actually called).
[dependencies.fragmentation-git]
path = "../../fragmentation/vcs/git"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Per Taut's profiling survey (#286 Win 1): the default dev / test
# profiles inherit small codegen-units counts which serialise the
# monolithic-binary codegen of `bootstrap` and dominate incremental
# rebuild wall-time. Bumping to 256 splits the codegen across cores
# and turns a ~30s relink into ~7–10s on the M3 Max profile
# machine. No behavioural impact (dev / test are not the artefacts
# we ship); strictly a tooling tick.
[profile.dev]
codegen-units = 256

[profile.test]
codegen-units = 256
