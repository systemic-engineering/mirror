[package]
name = "mirror"
version = "0.1.0"
edition = "2021"

[dependencies]
# SHA-256 — still used by `hash.rs` (the canonical_hash / CoincidenceHash
# substrate, distinct from Splinter's content hash). The cascade swaps
# Splinter's hash to BLAKE3 (via the `MerkleHash` trait + the `Blake3`
# default) but leaves `hash.rs` untouched — different altitude, different
# machinery. Per docs/specs/store-vs-db-and-the-cascade.md §2.2.
sha2 = "0.10"
# BLAKE3 — the default `MerkleHash` backend for `Splinter`. Powers
# `@mirror/store`'s open content-addressed storage gate per the
# landing-page spec §1.1 (`docs/specs/store-vs-db-and-the-cascade.md`).
blake3 = { version = "1", default-features = false }
# The spectral-triple substrate. `prism-core` provides the `Prism` trait
# (the algebra A) and `IdentityPrism` (the identity element), with the
# `bundle` feature surfacing the supertrait closure that realizes the
# spectral-triple structure. `terni` provides `Imperfect` (the verdict
# carrier for D's partially-defined action) and `Metric` (the residual
# bound). Per docs/specs/prism-core-as-spectral-triple.md.
#
# The `lapack` feature wires prism-core's Fortran FFI (the dsyev /
# dgesvd wrappers over LAPACK; gfortran + Accelerate framework on
# darwin) so the bootstrap can discharge sheaf_laplacian.mirror's
# `lambda_zero` obligation via real eigendecomposition. Per T8
# (the LRM for the flang/mirror numerical split per
# docs/specs/numerical-substrate-via-fortran.md §1.4) and the
# substrate declaration in shards/epistemologic/math/sheaf_laplacian.mirror.
prism-core = { path = "../../prism/core", features = ["bundle", "lapack"] }
terni = { path = "../../prism/imperfect", default-features = false }
# Used by `cmd_kintsugi_single`'s `--ci` JSON serialiser. Per T11.2 of
# `docs/specs/kintsugi-ci-v0.1.md`. The `--ci` flag emits a verdict
# envelope (`verdict`, `target`, `objective`, `iterations`, `dark_count`)
# whose shape is the substrate-altitude obligation the wire altitude
# (GitHub Actions composite step) parses.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# libc — the OS-layer substrate carrier for the T20 portal lift
# (`docs/insights/2026-06-08-portal-eigenvalue-stream-gen-prism.md`
# §"T20 — SCM_RIGHTS handoff at the CLI pipe boundary"). The
# substrate's `shift(oid, T)` typed-capability primitive (the
# 26th-instance recognition) lands at the OS layer as `SCM_RIGHTS`
# fd-passing over AF_UNIX; the substrate state never re-serialises
# across the process boundary. `libc` exposes `fstat` (the
# socket-detection discriminator), `sendmsg` / `recvmsg` (the
# ancillary-message dance), and the `CMSG_*` macros (the cmsg
# walker). Pulled directly rather than via the `nix` crate because
# `libc` is the minimum substrate addition for the LRM closure;
# `nix` would be a heavier consumer-pull for the same surface.
#
# Per substrate decisions: `[[architecture-fragmentation-is-the-
# rust-substrate]]` (the OS layer IS the Rust substrate at this
# altitude); `[[feedback-substrate-already-had-the-word]]` (libc
# was already in the transitive closure via `cpufeatures`; the
# direct declaration just names it).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Per Taut's profiling survey (#286 Win 1): the default dev / test
# profiles inherit small codegen-units counts which serialise the
# monolithic-binary codegen of `bootstrap` and dominate incremental
# rebuild wall-time. Bumping to 256 splits the codegen across cores
# and turns a ~30s relink into ~7–10s on the M3 Max profile
# machine. No behavioural impact (dev / test are not the artefacts
# we ship); strictly a tooling tick.
[profile.dev]
codegen-units = 256

[profile.test]
codegen-units = 256
